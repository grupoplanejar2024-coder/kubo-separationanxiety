<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spider-Man: Separation Anxiety - Kubo Touch</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #121212; color: #fff; font-family: Arial, sans-serif; overflow: hidden; }
        header { text-align: center; padding: 15px; background: #1e1e1e; }
        .badge { background: #f39c12; color: #fff; padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; }
        #game-card { max-width: 500px; margin: 20px auto; background: #1e1e1e; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .cover-container { width: 100%; height: 250px; background-image: url('separationanxiety-cover.jpg'); background-size: cover; background-position: center; }
        .content { padding: 20px; }
        h1 { margin: 0 0 10px 0; font-size: 24px; color: #f1c40f; }
        .meta-info { display: flex; gap: 10px; margin-bottom: 15px; font-size: 13px; color: #aaa; }
        .description { font-size: 14px; line-height: 1.5; color: #ddd; margin-bottom: 15px; }
        .details { font-size: 13px; color: #bbb; margin-bottom: 20px; }
        .details ul { padding-left: 20px; margin: 0; }
        .btn-play { display: block; width: 100%; padding: 12px; background: #27ae60; color: #fff; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; text-align: center; }
        .btn-play:hover { background: #219150; }

        /* Correção para evitar a tela preta e garantir tela cheia */
        #game-container { 
            display: none; 
            width: 100vw; 
            height: 100vh; 
            position: fixed; 
            top: 0; 
            left: 0; 
            z-index: 9999; 
            background: #000; 
        }
        #game-container > div {
            width: 100%;
            height: 100%;
        }
        #game { 
            width: 100%; 
            height: 100%; 
        }
    </style>
</head>
<body>

    <header id="main-header">
        <span class="badge">KUBO TOUCH</span>
    </header>

    <div id="game-card">
        <div class="cover-container"></div>
        <div class="content">
            <h1>Spider-Man: Separation Anxiety</h1>
            <div class="meta-info">
                <span>🎮 1-2 Jogadores</span>
                <span>📅 1995</span>
                <span>🏢 LJN / Acclaim</span>
            </div>

            <p class="description">
                Junte forças (ou jogue com um amigo) unindo o Homem-Aranha e o seu antigo rival Venom para deter a ameaça dos simbiontes e do Carnificina neste clássico de ação e porradaria!
            </p>

            <div class="details">
                <ul>
                    <li><strong>🎯 Gênero:</strong> Ação / Beat 'em Up</li>
                </ul>
            </div>

            <button class="btn-play" onclick="startEmulator()">► JOGAR AGORA</button>
        </div>
    </div>

 <div id="game-container" style="display:none; position:fixed; inset:0; width:100vw; height:100vh; background:#000; z-index:9999;">
    <div id="game" style="width:100%; height:100%;"></div>
</div>

   <script>
    async function startEmulator() {
        document.getElementById('game-card').style.display = 'none';
        document.getElementById('main-header').style.display = 'none';
        const container = document.getElementById('game-container');
        container.style.display = 'block';

        const romUrl = "separationanxiety.sfc"; // mesmo site (GitHub Pages)

        function showError(msg) {
            container.innerHTML =
                '<div style="color:#fff;padding:20px;font-family:Arial;font-size:16px;line-height:1.5">' +
                '<b style="color:#e74c3c">Erro:</b><br>' + msg +
                '<br><br><button onclick="location.reload()" style="padding:10px 16px">Voltar</button></div>';
        }

        // 1) Testa se a ROM existe e tem tamanho válido
        try {
            const r = await fetch(romUrl, { method: "HEAD" });
            if (!r.ok) throw new Error("ROM não encontrada (HTTP " + r.status + ")");
            const size = parseInt(r.headers.get("content-length") || "0", 10);
            if (size && size < 100000) throw new Error("O arquivo da ROM está muito pequeno (" + size + " bytes). Foi enviado errado ao GitHub.");
        } catch (e) {
            showError(e.message + "<br>Abra a página pelo link do GitHub Pages, não pelo arquivo local.");
            return;
        }

        // 2) Configura o EmulatorJS
        window.EJS_player = "#game";
        window.EJS_core = "snes";
        window.EJS_gameName = "Spider-Man Separation Anxiety";
        window.EJS_color = "#f39c12";
        window.EJS_startOnLoaded = true;
        window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
        window.EJS_gameUrl = romUrl;

        // 3) Carrega o loader
        const script = document.createElement("script");
        script.src = window.EJS_pathtodata + "loader.js";
        script.onerror = () => showError("Não foi possível carregar o EmulatorJS (cdn.emulatorjs.org). Verifique a internet.");
        document.body.appendChild(script);
    }
</script>
